<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker — Mini Games Collection</title>
    <meta name="description" content="Classic breakout! Bounce the ball off your paddle to smash all the bricks.">
    <link rel="icon" type="image/png" href="icons/brick-breaker.png">
    <style>
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-display: swap;
            font-weight: 100 900;
            src: url('fonts/Outfit-Variable.woff2') format('woff2');
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: #f0f0f5;
            overflow: hidden;
        }
        .game-header {
            width: 100%; max-width: 480px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 4px; margin-bottom: 8px; z-index: 100; gap: 12px;
        }
        .game-title {
            font-size: clamp(18px, 4.5vw, 24px); font-weight: 800; margin: 0;
            background: linear-gradient(135deg, #7c5cfc, #ff6b9d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            white-space: nowrap; text-align: center;
        }
        .back-btn, .restart-btn {
            position: relative; z-index: 10;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #f0f0f5;
            padding: 6px 14px; border-radius: 100px; font-family: 'Outfit', sans-serif;
            font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 4px;
            flex-shrink: 0;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-2px); }
        .restart-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(2px); }
        #gameContainer {
            position: relative; width: 100%; max-width: 480px; aspect-ratio: 480/600; height: auto;
            background: #0d0d24; border: 2px solid rgba(124,92,252,0.3);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 40px rgba(124,92,252,0.1); cursor: none;
        }
        .hud {
            position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px;
            display: flex; justify-content: space-between; z-index: 10;
            font-size: 15px; font-weight: 600;
        }
        .hud-item {
            background: rgba(255,255,255,0.06); padding: 4px 14px; border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .hud-item span { color: #7c5cfc; }
        canvas { display: block; width: 100%; height: 100%; }

        #gameOverScreen {
            position: absolute; inset: 0;
            background: rgba(10,10,26,0.95); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            flex-direction: column; z-index: 20; border-radius: 12px;
        }
        #gameOverScreen h2 {
            font-size: 42px; font-weight: 800; margin-bottom: 8px;
            background: linear-gradient(135deg, #7c5cfc, #ff6b9d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        #gameOverScreen p { font-size: 20px; color: rgba(240,240,245,0.7); margin: 6px; }
        #gameOverScreen p span { color: #7c5cfc; font-weight: 700; }
        #gameOverScreen button {
            margin-top: 24px; padding: 12px 32px; font-size: 16px; font-weight: 700;
            background: linear-gradient(135deg, #7c5cfc, #a78bfa); color: white;
            border: none; border-radius: 100px; cursor: pointer;
            font-family: 'Outfit', sans-serif; transition: all 0.3s;
        }
        #gameOverScreen button:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(124,92,252,0.3); }

        .instructions {
            font-size: 13px; margin-top: 14px; color: rgba(240,240,245,0.4); font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="index.html" class="back-btn">← Back</a>
        <h1 class="game-title">🧱 Brick Breaker</h1>
        <button class="restart-btn" id="inGameRestartBtn">↻ Restart</button>
    </div>
    <div id="gameContainer">
        <div class="hud">
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-item">Lives: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas" width="480" height="600"></canvas>
        <div id="gameOverScreen">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>
    <div class="instructions">🖱️ Move mouse to control paddle • Break all the bricks!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const inGameRestartBtn = document.getElementById('inGameRestartBtn');

        inGameRestartBtn.addEventListener('click', restartGame);
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const finalScoreDisplay = document.getElementById('finalScore');

        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let particles = [];

        let ball = { x: canvas.width / 2, y: canvas.height - 100, radius: 7, dx: 3, dy: -3, speed: 3 };

        let paddle = { x: canvas.width / 2 - 45, y: canvas.height - 24, width: 90, height: 14 };

        let bricks = [];
        const brickWidth = 52;
        const brickHeight = 18;
        const brickPadding = 6;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 18;
        const brickRows = 5;
        const brickCols = 8;

        const brickColors = [
            ['#ff6b9d', '#ff8fab'], // row 0 - pink
            ['#ff9a56', '#ffb347'], // row 1 - orange
            ['#ffd93d', '#ffe66d'], // row 2 - yellow
            ['#6bcf7f', '#a8e6cf'], // row 3 - green
            ['#7c5cfc', '#a78bfa'], // row 4 - purple
        ];

        function initBricks() {
            bricks = [];
            for (let row = 0; row < brickRows; row++) {
                for (let col = 0; col < brickCols; col++) {
                    bricks.push({
                        x: col * (brickWidth + brickPadding) + brickOffsetLeft,
                        y: row * (brickHeight + brickPadding) + brickOffsetTop,
                        width: brickWidth,
                        height: brickHeight,
                        color: brickColors[row][0],
                        highlight: brickColors[row][1],
                        destroyed: false,
                        hp: row < 2 ? 2 : 1
                    });
                }
            }
        }

        // Mouse & Touch control
        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (clientX - rect.left) * scaleX;
            paddle.x = Math.max(0, Math.min(mouseX - paddle.width / 2, canvas.width - paddle.width));
        }

        document.addEventListener('mousemove', (e) => {
            handleMove(e.clientX);
        });

        document.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const touchY = e.touches[0].clientY;
                if (touchY >= rect.top - 100 && touchY <= rect.bottom + 200) {
                    e.preventDefault();
                    handleMove(e.touches[0].clientX);
                }
            }
        }, { passive: false });

        document.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const touchY = e.touches[0].clientY;
                if (touchY >= rect.top - 100 && touchY <= rect.bottom + 200) {
                    e.preventDefault();
                    handleMove(e.touches[0].clientX);
                }
            }
        }, { passive: false });

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function drawBall() {
            // Glow
            ctx.save();
            ctx.shadowColor = '#7c5cfc';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#a78bfa';
            ctx.fill();
            ctx.restore();
            // Core
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius - 1, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function drawPaddle() {
            const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.width, paddle.y);
            grad.addColorStop(0, '#7c5cfc');
            grad.addColorStop(1, '#a78bfa');
            ctx.save();
            ctx.shadowColor = '#7c5cfc';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 7);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
        }

        function drawBricks() {
            bricks.forEach(brick => {
                if (!brick.destroyed) {
                    const grad = ctx.createLinearGradient(brick.x, brick.y, brick.x + brick.width, brick.y + brick.height);
                    grad.addColorStop(0, brick.color);
                    grad.addColorStop(1, brick.highlight);
                    ctx.beginPath();
                    ctx.roundRect(brick.x, brick.y, brick.width, brick.height, 4);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    if (brick.hp > 1) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            });
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function collisionDetection() {
            bricks.forEach(brick => {
                if (!brick.destroyed) {
                    if (ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height) {
                        ball.dy = -ball.dy;
                        brick.hp--;
                        if (brick.hp <= 0) {
                            brick.destroyed = true;
                            score += 10;
                            spawnParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.color, 8);
                        } else {
                            score += 5;
                            brick.color = brick.highlight;
                        }
                        scoreDisplay.textContent = score;
                        ball.speed = Math.min(6, ball.speed + 0.05);
                    }
                }
            });
        }

        function update() {
            if (!gameRunning) return;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.dx = -ball.dx;
            if (ball.y - ball.radius < 0) ball.dy = -ball.dy;

            // Paddle collision
            if (ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x && ball.x < paddle.x + paddle.width &&
                ball.dy > 0) {
                ball.dy = -Math.abs(ball.dy);
                let hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                ball.dx = hitPos * ball.speed * 1.5;
                // Fix: ensure minimum horizontal movement
                if (Math.abs(ball.dx) < 0.5) ball.dx = (Math.random() > 0.5 ? 1 : -1) * 0.8;
                ball.y = paddle.y - ball.radius;
            }

            if (ball.y + ball.radius > canvas.height) {
                lives--;
                livesDisplay.textContent = lives;
                if (lives <= 0) {
                    endGame(false);
                } else {
                    ball.x = canvas.width / 2;
                    ball.y = canvas.height - 100;
                    ball.dx = 3 * (Math.random() > 0.5 ? 1 : -1);
                    ball.dy = -3;
                    ball.speed = 3;
                }
            }

            collisionDetection();
            if (bricks.every(b => b.destroyed)) endGame(true);
        }

        function draw() {
            ctx.fillStyle = '#0d0d24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle grid
            ctx.strokeStyle = 'rgba(124, 92, 252, 0.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            drawBricks();
            drawParticles();
            drawBall();
            drawPaddle();
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) requestAnimationFrame(gameLoop);
        }

        function endGame(won) {
            gameRunning = false;
            gameOverScreen.style.display = 'flex';
            gameOverTitle.textContent = won ? 'You Won! 🎉' : 'Game Over!';
            finalScoreDisplay.textContent = score;
        }

        function restartGame() {
            score = 0; lives = 3; gameRunning = true; particles = [];
            ball = { x: canvas.width / 2, y: canvas.height - 100, radius: 7, dx: 3, dy: -3, speed: 3 };
            paddle = { x: canvas.width / 2 - 45, y: canvas.height - 24, width: 90, height: 14 };
            scoreDisplay.textContent = '0'; livesDisplay.textContent = '3';
            gameOverScreen.style.display = 'none';
            initBricks(); gameLoop();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !gameRunning) restartGame();
        });

        initBricks();
        gameLoop();
    </script>
</body>
</html>
