<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Ball — Mini Games Collection</title>
    <meta name="description" content="Click on falling balls to catch them before they escape!">
    <link rel="icon" type="image/png" href="icons/catch-ball.png">
    <style>
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-display: swap;
            font-weight: 100 900;
            src: url('fonts/Outfit-Variable.woff2') format('woff2');
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Outfit', sans-serif; color: #f0f0f5; overflow: hidden;
        }
        .back-btn {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #f0f0f5;
            padding: 8px 18px; border-radius: 100px; font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-2px); }

        .restart-btn {
            position: fixed; top: 16px; right: 16px; z-index: 100;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #f0f0f5;
            padding: 8px 18px; border-radius: 100px; font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px;
        }
        .restart-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(2px); }

        .game-title {
            font-size: 28px; font-weight: 800; margin-bottom: 16px;
            background: linear-gradient(135deg, #7c5cfc, #00d4aa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .game-hud {
            display: flex; gap: 12px; margin-bottom: 16px; align-items: center;
        }
        .hud-item {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            padding: 6px 18px; border-radius: 100px; font-size: 15px; font-weight: 600;
        }
        .hud-item span { color: #7c5cfc; }

        .game-btn {
            padding: 8px 20px; font-size: 14px; font-weight: 600;
            border: none; border-radius: 100px; cursor: pointer;
            font-family: 'Outfit', sans-serif; transition: all 0.3s;
        }
        .btn-start { background: linear-gradient(135deg, #00d4aa, #00b894); color: #0a0a1a; }
        .btn-pause { background: linear-gradient(135deg, #ffd93d, #f5af19); color: #0a0a1a; }
        .btn-cancel { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
        .game-btn:hover { transform: scale(1.05); }

        #gameCanvas {
            display: block; width: 100%; max-width: 440px; aspect-ratio: 440/520; height: auto;
            border-radius: 12px;
            border: 2px solid rgba(124,92,252,0.2);
            box-shadow: 0 0 40px rgba(124,92,252,0.1);
            background: #0d0d24; cursor: crosshair;
        }

        #countdown {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px; font-weight: 900; color: #ffd93d;
            text-shadow: 0 0 40px rgba(255,217,61,0.5);
            display: none; z-index: 50;
        }

        .instructions { font-size: 13px; margin-top: 14px; color: rgba(240,240,245,0.4); }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    <button class="restart-btn" id="inGameRestartBtn">↻ Restart</button>
    <div class="game-title">🎯 Catch the Ball</div>
    <div class="game-hud">
        <div class="hud-item">Score: <span id="score">0</span></div>
        <button class="game-btn btn-start" id="startBtn">Start</button>
        <button class="game-btn btn-pause" id="pauseBtn">Pause</button>
        <button class="game-btn btn-cancel" id="cancelBtn">Reset</button>
    </div>

    <div id="countdown">3</div>
    <canvas id="gameCanvas" width="440" height="520"></canvas>
    <div class="instructions">🖱️ Click on the ball to catch it • Speed increases over time!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const countdownDisplay = document.getElementById('countdown');

        let ball = { x: Math.random() * 380 + 30, y: 0, radius: 22, speed: 2.5 };
        let score = 0, gameRunning = false, animationId = null;
        let particles = [];

        function drawBall() {
            // Glow
            ctx.save();
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 20;
            const grad = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, ball.radius);
            grad.addColorStop(0, '#ff8a8a');
            grad.addColorStop(0.7, '#ff6b6b');
            grad.addColorStop(1, '#ee5a24');
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
            // Highlight
            ctx.beginPath();
            ctx.arc(ball.x - 5, ball.y - 5, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fill();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function spawnCatchParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1, size: Math.random() * 3 + 1,
                    color: ['#ff6b6b', '#ffd93d', '#00d4aa', '#7c5cfc'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function update() {
            ctx.fillStyle = '#0d0d24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(124,92,252,0.04)';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            drawBall();
            drawParticles();
            ball.y += ball.speed;

            if (ball.y > canvas.height + ball.radius) {
                ball.y = -ball.radius;
                ball.x = Math.random() * (canvas.width - 60) + 30;
                ball.speed += 0.15;
            }

            if (gameRunning) animationId = requestAnimationFrame(update);
        }

        function startCountdown(callback) {
            let counter = 3;
            countdownDisplay.style.display = 'block';
            countdownDisplay.textContent = counter;
            const timer = setInterval(() => {
                counter--;
                countdownDisplay.textContent = counter > 0 ? counter : 'GO!';
                if (counter < 0) {
                    clearInterval(timer);
                    countdownDisplay.style.display = 'none';
                    callback();
                }
            }, 800);
        }

        function handleInteraction(clientX, clientY) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (clientX - rect.left) * scaleX;
            const mouseY = (clientY - rect.top) * scaleY;
            const dx = mouseX - ball.x, dy = mouseY - ball.y;
            // Slightly increased hit radius for better touch targeting
            if (Math.sqrt(dx * dx + dy * dy) < ball.radius + 15) {
                spawnCatchParticles(ball.x, ball.y);
                score++;
                scoreDisplay.textContent = score;
                ball.y = -ball.radius;
                ball.x = Math.random() * (canvas.width - 60) + 30;
            }
        }

        canvas.addEventListener('click', (e) => handleInteraction(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                e.preventDefault();
                handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!gameRunning) {
                startCountdown(() => { gameRunning = true; update(); });
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            gameRunning = false;
            cancelAnimationFrame(animationId);
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            ctx.fillStyle = '#0d0d24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            score = 0; particles = [];
            scoreDisplay.textContent = '0';
            ball = { x: Math.random() * 380 + 30, y: 0, radius: 22, speed: 2.5 };
        });

        function fullRestart() {
            document.getElementById('cancelBtn').click();
            document.getElementById('startBtn').click();
        }

        document.getElementById('inGameRestartBtn').addEventListener('click', fullRestart);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fullRestart();
        });
    </script>
</body>
</html>
