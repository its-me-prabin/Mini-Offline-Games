<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Game — Mini Games Collection</title>
    <meta name="description" content="Aim your bow and shoot arrows at a moving target. Choose your difficulty!">
    <link rel="icon" type="image/png" href="icons/arrow-game.png">
    <script src="lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('fonts/Outfit-Variable.woff2') format('woff2');
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Outfit', sans-serif;
        background: #0a0a1a;
        overflow: hidden;
        height: 100vh;
      }
      svg {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }

      /* Back Button */
      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        color: #f0f0f5;
        padding: 8px 18px;
        border-radius: 100px;
        font-family: 'Outfit', sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .back-btn:hover {
        background: rgba(255,255,255,0.15);
        transform: translateX(-2px);
      }

        .restart-btn {
            position: fixed; top: 16px; right: 16px; z-index: 100;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #f0f0f5;
            padding: 8px 18px; border-radius: 100px; font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px;
        }
        .restart-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(2px); }

      /* HUD */
      #hud {
        position: fixed;
        top: 16px;
        right: 140px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 8px 18px;
        border-radius: 100px;
        color: #f0f0f5;
        font-family: 'Outfit', sans-serif;
        font-size: 14px;
        font-weight: 600;
      }
      #hud select {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: #f0f0f5;
        padding: 4px 10px;
        border-radius: 8px;
        font-family: 'Outfit', sans-serif;
        font-size: 13px;
        cursor: pointer;
      }
      #hud select option { background: #1a1a2e; color: #f0f0f5; }

      .hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.4);
        font-family: 'Outfit', sans-serif;
        font-size: 14px;
        z-index: 100;
        pointer-events: none;
      }

      /* Score display */
      #score-display {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.15);
        padding: 8px 24px;
        border-radius: 100px;
        color: #88ce02;
        font-family: 'Outfit', sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    <button class="restart-btn" id="inGameRestartBtn">↻ Restart</button>
    <div id="score-display">Score: <span id="scoreValue">0</span></div>
    <div id="hud">
      Level:
      <select id="levelSelect">
        <option value="easy">Easy</option>
        <option value="moderate">Moderate</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <svg id="game" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" overflow="visible">
      <linearGradient id="ArcGradient">
          <stop offset="0" stop-color="#88ce02" stop-opacity=".4"/>
          <stop offset="50%" stop-color="#88ce02" stop-opacity="0"/>
      </linearGradient>
        <path id="arc" fill="none" stroke="url(#ArcGradient)" stroke-width="4" d="M100,250c250-400,550-400,800,0" pointer-events="none"/>
        <defs>
            <g id="arrow">
                <line x2="60" fill="none" stroke="#aaa" stroke-width="2" />
                <polygon fill="#aaa" points="64 0 58 2 56 0 58 -2" />
                <polygon fill="#88ce02" points="2 -3 -4 -3 -1 0 -4 3 2 3 5 0" />
            </g>
        </defs>
        <g id="target">
            <path fill="#FFF" d="M924.2,274.2c-21.5,21.5-45.9,19.9-52,3.2c-4.4-12.1,2.4-29.2,14.2-41c11.8-11.8,29-18.6,41-14.2 C944.1,228.3,945.7,252.8,924.2,274.2z" />
            <path fill="#F4531C" d="M915.8,265.8c-14.1,14.1-30.8,14.6-36,4.1c-4.1-8.3,0.5-21.3,9.7-30.5s22.2-13.8,30.5-9.7 C930.4,235,929.9,251.7,915.8,265.8z" />
            <path fill="#FFF" d="M908.9,258.9c-8,8-17.9,9.2-21.6,3.5c-3.2-4.9-0.5-13.4,5.6-19.5c6.1-6.1,14.6-8.8,19.5-5.6 C918.1,241,916.9,250.9,908.9,258.9z" />
            <path fill="#F4531C" d="M903.2,253.2c-2.9,2.9-6.7,3.6-8.3,1.7c-1.5-1.8-0.6-5.4,2-8c2.6-2.6,6.2-3.6,8-2 C906.8,246.5,906.1,250.2,903.2,253.2z" />
        </g>
        <g id="bow" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke" pointer-events="none">
          <polyline fill="none" stroke="#ddd" stroke-linecap="round" points="88,200 88,250 88,300"/>
          <path fill="none" stroke="#88ce02" stroke-width="3" stroke-linecap="round" d="M88,300 c0-10.1,12-25.1,12-50s-12-39.9-12-50"/>
        </g>
      <g class="arrow-angle"><use x="100" y="250" href="#arrow"/></g>
      <clipPath id="mask">
        <polygon opacity=".5" points="0,0 1500,0 1500,200 970,290 950,240 925,220 875,280 890,295 920,310 0,350" pointer-events="none"/>
      </clipPath>
      <g class="arrows" clip-path="url(#mask)" pointer-events="none">
      </g>
     <g class="missyou" fill="#aaa" opacity="0" transform="translate(-50, 50)">
      <path d="M358 194L363 118 386 120 400 153 416 121 440 119 446 203 419 212 416 163 401 180 380 160 381 204"/>
      <path d="M450 120L458 200 475 192 474 121"/>
      <path d="M537 118L487 118 485 160 515 162 509 177 482 171 482 193 529 199 538 148 501 146 508 133 537 137"/>
      <path d="M540 202L543 178 570 186 569 168 544 167 546 122 590 116 586 142 561 140 560 152 586 153 586 205"/>
      <path d="M630 120 L650 160 L670 120 L690 120 L660 170 L660 200 L640 200 L640 170 L610 120 Z"/>
      <path d="M700 160 A20 20 0 1 1 699.9 160"/>
      <path d="M730 140 L730 180 A20 20 0 0 0 770 180 L770 140 L750 140 L750 180 A5 5 0 0 1 750 180 L750 140 Z"/>
      <path d="M790 150 L790 180 L810 180 L810 100 Z M790 200 L810 200 L810 220 L790 220 Z"/>
    </g>

    <g class="loveyou" fill="#88ce02" opacity="0" transform="translate(300, 100)">
      <path d="M0 0 L0 80 L30 80 L30 70 L10 70 L10 0 Z"/>
      <path d="M50 40 A20 20 0 1 1 49.9 40"/>
      <path d="M80 0 L100 80 L120 0 L110 0 L100 60 L90 0 Z"/>
      <path d="M140 0 L140 80 L170 80 L170 70 L150 70 L150 50 L170 50 L170 40 L150 40 L150 10 L170 10 L170 0 Z"/>
      <path d="M190 0 L205 30 L220 0 L230 0 L210 40 L210 80 L200 80 L200 40 L180 0 Z"/>
      <path d="M250 40 A20 20 0 1 1 249.9 40"/>
      <path d="M280 0 L280 50 A20 20 0 0 0 320 50 L320 0 L310 0 L310 50 A10 10 0 0 1 290 50 L290 0 Z"/>
    </g>
      <g class="hit" fill="#ffcc00" opacity="0" transform="translate(180, -80) rotate(12) ">
        <path d="M383 114L385 195 407 191 406 160 422 155 418 191 436 189 444 112 423 119 422 141 407 146 400 113"/>
        <path d="M449 185L453 113 477 112 464 186"/>
        <path d="M486 113L484 130 506 130 481 188 506 187 520 131 540 135 545 119"/>
        <path d="M526,195l5-20l22,5l-9,16L526,195z M558,164l32-44l-35-9l-19,51L558,164z"/>
      </g>
    </svg>
    <span class="hint">Draw back an arrow and launch it!</span>

    <script>
      var svg = document.querySelector("svg");
      var cursor = svg.createSVGPoint();
      var arrows = document.querySelector(".arrows");
      var randomAngle = 0;
      var scoreVal = 0;
      var scoreValueEl = document.getElementById('scoreValue');
      var inGameRestartBtn = document.getElementById('inGameRestartBtn');

      function restartGame() {
          scoreVal = 0;
          scoreValueEl.textContent = '0';
          arrows.innerHTML = '';
      }

      inGameRestartBtn.addEventListener('click', restartGame);
      document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') restartGame();
      });

      let target = { x: 900, y: 249.5 };
      let lineSegment = { x1: 875, y1: 280, x2: 925, y2: 220 };
      var baseTarget = { x: target.x, y: target.y };
      var baseLine = { x1: lineSegment.x1, y1: lineSegment.y1, x2: lineSegment.x2, y2: lineSegment.y2 };
      var targetGroup = document.getElementById('target');
      var levelSelect = document.getElementById('levelSelect');
      var level = levelSelect.value;
      levelSelect.addEventListener('change', function(e){ level = e.target.value; });

      var levelParams = {
        easy: { amp: 6, speed: 0.002, yAmp: 2 },
        moderate: { amp: 30, speed: 0.004, yAmp: 6 },
        hard: { amp: 70, speed: 0.007, yAmp: 10 }
      };

      var startTime = null;
      function animateTarget(ts){
        if (!startTime) startTime = ts;
        var elapsed = ts - startTime;
        var p = levelParams[level] || levelParams.easy;
        var dx = Math.sin(elapsed * p.speed) * p.amp;
        var dy = Math.sin(elapsed * p.speed * 1.3) * p.yAmp;
        targetGroup.setAttribute('transform', 'translate(' + dx + ',' + dy + ')');
        target.x = baseTarget.x + dx;
        target.y = baseTarget.y + dy;
        lineSegment.x1 = baseLine.x1 + dx; lineSegment.y1 = baseLine.y1 + dy;
        lineSegment.x2 = baseLine.x2 + dx; lineSegment.y2 = baseLine.y2 + dy;
        requestAnimationFrame(animateTarget);
      }
      requestAnimationFrame(animateTarget);

      let pivot = { x: 100, y: 250 };
      
      // Initialize bow state
      handleMove({ clientX: window.innerWidth / 3, clientY: window.innerHeight / 2, type: 'init' });

      window.addEventListener("mousedown", handleStart);
      window.addEventListener("touchstart", handleStart, { passive: false });

      function handleStart(e) {
        if (e.target.closest('.back-btn') || e.target.closest('#hud') || e.target.closest('.restart-btn')) return;
        if (e.type === 'touchstart') e.preventDefault();
        
        randomAngle = Math.random() * Math.PI * 0.03 - 0.015;
        gsap.to(".arrow-angle use", { duration: 0.3, opacity: 1 });
        
        window.addEventListener("mousemove", handleMove);
        window.addEventListener("touchmove", handleMove, { passive: false });
        
        window.addEventListener("mouseup", handleEnd);
        window.addEventListener("touchend", handleEnd);
        
        handleMove(e);
      }

      function handleMove(e) {
        if (e.type === 'touchmove') e.preventDefault();
        
        var clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches.length > 0 ? e.touches[0].clientX : 0);
        var clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches.length > 0 ? e.touches[0].clientY : 0);
        
        var point = getPoint(clientX, clientY);
        point.x = Math.min(point.x, pivot.x - 7);
        point.y = Math.max(point.y, pivot.y + 7);
        var dx = point.x - pivot.x;
        var dy = point.y - pivot.y;
        var angle = Math.atan2(dy, dx) + randomAngle;
        var bowAngle = angle - Math.PI;
        var distance = Math.min(Math.sqrt(dx * dx + dy * dy), 50);
        var scale = Math.min(Math.max(distance / 30, 1), 2);

        gsap.to("#bow", { duration: 0.3, scaleX: scale, rotation: bowAngle + "rad", transformOrigin: "right center" });
        gsap.to(".arrow-angle", { duration: 0.3, rotation: bowAngle + "rad", svgOrigin: "100 250" });
        gsap.to(".arrow-angle use", { duration: 0.3, x: -distance });
        gsap.to("#bow polyline", { duration: 0.3,
          attr: { points: "88,200 " + Math.min(pivot.x - (1 / scale) * distance, 88) + ",250 88,300" }
        });

        var radius = distance * 9;
        var offset = { x: Math.cos(bowAngle) * radius, y: Math.sin(bowAngle) * radius };
        var arcWidth = offset.x * 3;

        gsap.to("#arc", { duration: 0.3,
          attr: { d: "M100,250c" + offset.x + "," + offset.y + "," + (arcWidth - offset.x) + "," + (offset.y + 50) + "," + arcWidth + ",50" },
          autoAlpha: distance / 60
        });
      }

      function handleEnd(e) {
        window.removeEventListener("mousemove", handleMove);
        window.removeEventListener("touchmove", handleMove);
        window.removeEventListener("mouseup", handleEnd);
        window.removeEventListener("touchend", handleEnd);

        gsap.to("#bow", { duration: 0.4, scaleX: 1, transformOrigin: "right center", ease: "elastic.out(1, 0.3)" });
        gsap.to("#bow polyline", { duration: 0.4, attr: { points: "88,200 88,250 88,300" }, ease: "elastic.out(1, 0.3)" });

        var newArrow = document.createElementNS("http://www.w3.org/2000/svg", "use");
        newArrow.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#arrow");
        arrows.appendChild(newArrow);

        // Get arc path data and create bezier points manually
        var arcEl = document.getElementById('arc');
        var pathLength = arcEl.getTotalLength();
        var numPoints = 30;
        var bezierPoints = [];
        for (var i = 0; i <= numPoints; i++) {
          var pt = arcEl.getPointAtLength((i / numPoints) * pathLength);
          bezierPoints.push({ x: pt.x, y: pt.y });
        }

        // Animate along path using manual interpolation
        var arrowObj = { progress: 0 };
        gsap.to(arrowObj, {
          duration: 0.5,
          progress: 1,
          ease: "none",
          onUpdate: function() {
            var p = arrowObj.progress;
            var idx = p * (bezierPoints.length - 1);
            var i0 = Math.floor(idx);
            var i1 = Math.min(i0 + 1, bezierPoints.length - 1);
            var t = idx - i0;
            var cx = bezierPoints[i0].x + (bezierPoints[i1].x - bezierPoints[i0].x) * t;
            var cy = bezierPoints[i0].y + (bezierPoints[i1].y - bezierPoints[i0].y) * t;

            // Calculate rotation
            var nx = i1 < bezierPoints.length - 1 ? bezierPoints[i1 + 1] || bezierPoints[i1] : bezierPoints[i1];
            var px = bezierPoints[i0];
            var rot = Math.atan2(nx.y - px.y, nx.x - px.x) * (180 / Math.PI);

            newArrow.setAttribute('x', cx);
            newArrow.setAttribute('y', cy);
            newArrow.setAttribute('transform', 'rotate(' + rot + ' ' + cx + ' ' + cy + ')');

            // Hit test during flight
            checkArrowHit(cx, cy, newArrow, arrowObj);
          },
          onComplete: function() {
            onMiss();
            try { if(newArrow.parentNode) newArrow.parentNode.removeChild(newArrow); } catch(e){}
          }
        });

        gsap.to("#arc", { duration: 0.3, opacity: 0 });
        gsap.set(".arrow-angle use", { opacity: 0 });
      }

      function checkArrowHit(tipX, tipY, arrowEl, tweenObj) {
        var dx = tipX - target.x;
        var dy = tipY - target.y;
        var tipDistance = Math.sqrt(dx*dx + dy*dy);
        var hitRadius = 30;

        if (tipDistance < hitRadius) {
          gsap.killTweensOf(tweenObj);
          scoreVal += tipDistance < 7 ? 3 : 1;
          scoreValueEl.textContent = scoreVal;
          var selector = tipDistance < 7 ? ".loveyou" : ".hit";
          showMessage(selector);
          setTimeout(function(){ try{ if(arrowEl.parentNode) arrowEl.parentNode.removeChild(arrowEl); }catch(e){} }, 300);
        }
      }

      function onMiss() {
        showMessage(".missyou");
      }

      function showMessage(selector) {
        gsap.killTweensOf(selector + " path");
        gsap.set(selector, { autoAlpha: 1 });
        gsap.fromTo(selector + " path", { rotation: -5, scale: 0, transformOrigin: "center" },
          { duration: 0.5, scale: 1, ease: "back.out(1.7)", stagger: 0.05 });
        gsap.to(selector + " path", { delay: 2, duration: 0.3, rotation: 20, scale: 0, ease: "back.in(1.7)", stagger: 0.03 });
      }

      function getPoint(clientX, clientY) {
        cursor.x = clientX;
        cursor.y = clientY;
        return cursor.matrixTransform(svg.getScreenCTM().inverse());
      }
    </script>
</body>
</html>
