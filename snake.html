<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game — Mini Games Collection</title>
    <meta name="description" content="Classic snake! Eat food and grow longer. Don't crash into walls or yourself.">
    <link rel="icon" type="image/png" href="icons/snake.png">
    <style>
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-display: swap;
            font-weight: 100 900;
            src: url('fonts/Outfit-Variable.woff2') format('woff2');
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Outfit', sans-serif; color: #f0f0f5; overflow: hidden;
        }
        .back-btn {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #f0f0f5;
            padding: 8px 18px; border-radius: 100px; font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(-2px); }

        .restart-btn {
            position: fixed; top: 16px; right: 16px; z-index: 100;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); color: #f0f0f5;
            padding: 8px 18px; border-radius: 100px; font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px;
        }
        .restart-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(2px); }

        .game-title {
            font-size: 28px; font-weight: 800; margin-bottom: 16px;
            background: linear-gradient(135deg, #00d4aa, #7c5cfc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .game-hud {
            display: flex; gap: 12px; margin-bottom: 16px;
        }
        .hud-item {
            background: rgba(255,255,255,0.06); padding: 6px 16px; border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08); font-size: 14px; font-weight: 600;
        }
        .hud-item span { color: #00d4aa; }

        canvas {
            display: block; border-radius: 12px;
            border: 2px solid rgba(0,212,170,0.2);
            box-shadow: 0 0 40px rgba(0,212,170,0.1); background: #0d0d24;
            width: 100%; max-width: 440px; aspect-ratio: 1; height: auto;
        }

        /* Mobile Touch Controls */
        .mobile-controls {
            display: none;
            width: 100%;
            max-width: 250px;
            margin-top: 15px;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            user-select: none;
        }
        .control-btn {
            aspect-ratio: 1;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 212, 170, 0.5);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            touch-action: manipulation;
            cursor: pointer;
        }
        .control-btn:active { background: rgba(0, 212, 170, 0.5); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 768px) {
            .mobile-controls { display: grid; }
            canvas { max-height: 50vh; }
        }

        #gameOverScreen {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10,10,26,0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,170,0.3); border-radius: 20px;
            padding: 40px 50px; text-align: center; z-index: 50; display: none;
        }
        #gameOverScreen h2 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #00d4aa, #7c5cfc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        #gameOverScreen p { margin: 8px 0; color: rgba(240,240,245,0.7); font-size: 18px; }
        #gameOverScreen p span { color: #00d4aa; font-weight: 700; }
        #gameOverScreen button {
            margin-top: 16px; padding: 12px 32px; font-size: 16px; font-weight: 700;
            background: linear-gradient(135deg, #00d4aa, #00b894); color: #0a0a1a;
            border: none; border-radius: 100px; cursor: pointer; font-family: 'Outfit', sans-serif;
        }

        .instructions { font-size: 13px; margin-top: 14px; color: rgba(240,240,245,0.4); }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    <button class="restart-btn" id="inGameRestartBtn">↻ Restart</button>
    <div class="game-title">🐍 Snake Game</div>
    <div class="game-hud">
        <div class="hud-item">Score: <span id="score">0</span></div>
        <div class="hud-item">Level: <span id="level">1</span></div>
        <div class="hud-item">Best: <span id="best">0</span></div>
    </div>

    <canvas id="gameCanvas" width="440" height="440"></canvas>

    <div class="mobile-controls">
        <div class="control-btn btn-up" id="btn-up">▲</div>
        <div class="control-btn btn-left" id="btn-left">◀</div>
        <div class="control-btn btn-down" id="btn-down">▼</div>
        <div class="control-btn btn-right" id="btn-right">▶</div>
    </div>

    <div id="gameOverScreen">
        <h2>Game Over!</h2>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Level: <span id="finalLevel">1</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <div class="instructions">⌨️ Arrow keys or WASD to move • Eat food to grow!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const bestDisplay = document.getElementById('best');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const finalLevelDisplay = document.getElementById('finalLevel');
        const inGameRestartBtn = document.getElementById('inGameRestartBtn');

        inGameRestartBtn.addEventListener('click', restartGame);

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 1, dy = 0, nextDx = 1, nextDy = 0;
        let score = 0, level = 1, gameRunning = true;
        let best = parseInt(localStorage.getItem('snakeBest')) || 0;
        let moveInterval = 120; // Fixed: use proper interval-based timing
        let lastMoveTime = 0;
        let foodGlow = 0;

        bestDisplay.textContent = best;

        function placeFood() {
            do {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function update(timestamp) {
            if (!gameRunning) return;

            // Fixed: use actual timestamp delta instead of hardcoded 16ms
            if (timestamp - lastMoveTime < moveInterval) {
                requestAnimationFrame(update);
                return;
            }
            lastMoveTime = timestamp;

            dx = nextDx; dy = nextDy;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame(); return;
            }
            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame(); return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreDisplay.textContent = score;
                if (score % 5 === 0) {
                    level++;
                    levelDisplay.textContent = level;
                    moveInterval = Math.max(40, moveInterval - 10);
                }
                placeFood();
            } else {
                snake.pop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#0d0d24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(0, 212, 170, 0.04)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            // Snake body
            snake.forEach((segment, i) => {
                const alpha = 1 - (i / snake.length) * 0.5;
                if (i === 0) {
                    // Head with glow
                    ctx.save();
                    ctx.shadowColor = '#00d4aa';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#00d4aa';
                    ctx.beginPath();
                    ctx.roundRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2, 4);
                    ctx.fill();
                    ctx.restore();

                    // Eyes
                    ctx.fillStyle = '#0a0a1a';
                    if (dx === 1) { ctx.fillRect(segment.x*gridSize+13, segment.y*gridSize+5, 3, 3); ctx.fillRect(segment.x*gridSize+13, segment.y*gridSize+12, 3, 3); }
                    else if (dx === -1) { ctx.fillRect(segment.x*gridSize+4, segment.y*gridSize+5, 3, 3); ctx.fillRect(segment.x*gridSize+4, segment.y*gridSize+12, 3, 3); }
                    else if (dy === 1) { ctx.fillRect(segment.x*gridSize+5, segment.y*gridSize+13, 3, 3); ctx.fillRect(segment.x*gridSize+12, segment.y*gridSize+13, 3, 3); }
                    else { ctx.fillRect(segment.x*gridSize+5, segment.y*gridSize+4, 3, 3); ctx.fillRect(segment.x*gridSize+12, segment.y*gridSize+4, 3, 3); }
                } else {
                    ctx.fillStyle = `rgba(0, 212, 170, ${alpha})`;
                    ctx.beginPath();
                    ctx.roundRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4, 3);
                    ctx.fill();
                }
            });

            // Food with animated glow
            foodGlow += 0.08;
            const glowSize = 4 + Math.sin(foodGlow) * 3;
            ctx.save();
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = glowSize + 8;
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            // Food highlight
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2 - 2, food.y * gridSize + gridSize / 2 - 2, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; } e.preventDefault(); break;
                case 'ArrowDown': case 's': case 'S':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; } e.preventDefault(); break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; } e.preventDefault(); break;
                case 'ArrowRight': case 'd': case 'D':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; } e.preventDefault(); break;
                case 'Enter':
                    if (!gameRunning) restartGame(); e.preventDefault(); break;
            }
        });

        // Mobile touch controls wiring
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        function setupTouch(btn, ddx, ddy, blockDx, blockDy) {
            if (!btn) return;
            const press = (e) => { 
                e.preventDefault(); 
                if (dx !== blockDx || dy !== blockDy) { nextDx = ddx; nextDy = ddy; }
                if (!gameRunning) restartGame();
            };
            btn.addEventListener('touchstart', press);
            btn.addEventListener('mousedown', press);
        }
        setupTouch(btnUp, 0, -1, 0, 1);
        setupTouch(btnDown, 0, 1, 0, -1);
        setupTouch(btnLeft, -1, 0, 1, 0);
        setupTouch(btnRight, 1, 0, -1, 0);

        function endGame() {
            gameRunning = false;
            if (score > best) {
                best = score;
                localStorage.setItem('snakeBest', best);
                bestDisplay.textContent = best;
            }
            finalScoreDisplay.textContent = score;
            finalLevelDisplay.textContent = level;
            gameOverScreen.style.display = 'block';
        }

        function restartGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1; dy = 0; nextDx = 1; nextDy = 0;
            score = 0; level = 1; moveInterval = 120; gameRunning = true;
            scoreDisplay.textContent = '0'; levelDisplay.textContent = '1';
            gameOverScreen.style.display = 'none';
            placeFood();
            requestAnimationFrame(update);
        }

        placeFood();
        draw();
        requestAnimationFrame(update);
    </script>
</body>
</html>
